<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{meta.title}}</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1a1a;--muted:#6b6b6b;--border:#ddd;
  --accent:#2952cc;--accent-bg:#eef1fb;
  --ok:#1a7a4c;--ok-bg:#eaf6ef;
  --space-xs:4px;--space-sm:8px;--space-md:16px;--space-lg:32px;--space-xl:48px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#ffffff;color:var(--ink);line-height:1.7;font-size:15px}
.page{max-width:820px;margin:0 auto;padding:var(--space-xl) 24px}

/* ── Header（対比: タイトルを大きく強く、メタ情報は小さく控えめに） ── */
.doc-header{border-bottom:3px solid var(--ink);padding-bottom:var(--space-md);margin-bottom:var(--space-xl)}
.doc-title{font-size:2rem;font-weight:800;line-height:1.35;letter-spacing:-.01em;margin-bottom:var(--space-sm)}
.doc-meta{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.doc-overview{margin-bottom:var(--space-xl)}

/* ── 大項目（H2ごとにグループ化。見出しは1回だけ表示） ── */
.category{margin-bottom:var(--space-xl)}
.category-title{font-size:1.3rem;font-weight:800;border-bottom:2px solid var(--ink);
  padding-bottom:var(--space-xs);margin-bottom:var(--space-lg)}

/* ── Step（整列: 番号カラムを固定し、見出し・本文の左端を揃える） ── */
.step{display:grid;grid-template-columns:44px 1fr;column-gap:var(--space-md);
  padding-bottom:var(--space-lg);margin-bottom:var(--space-lg);border-bottom:1px solid var(--border);
  page-break-inside:avoid;break-inside:avoid}
.step:last-child{border-bottom:none;margin-bottom:0}

.step-num{grid-column:1;grid-row:1;width:44px;height:44px;border:2px solid var(--accent);
  border-radius:6px;color:var(--accent);font-size:1.1rem;font-weight:800;
  display:flex;align-items:center;justify-content:center}

.step-head{grid-column:2;grid-row:1}
.step-ttl{font-size:1.15rem;font-weight:700}

/* 近接: ヘッダーと本文の間は広め、各ブロック内のラベルと内容は密着させる */
.step-body{grid-column:2;grid-row:2;margin-top:var(--space-md)}
.step-block{padding-left:var(--space-md);border-left:3px solid var(--border);
  margin-bottom:var(--space-md)}
.step-block:last-child{margin-bottom:0}
.step-block.instruction{border-left-color:var(--accent)}
.step-block.expected{border-left-color:var(--ok)}
.step-block-label{font-size:.72rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:var(--space-xs)}
.step-block.instruction .step-block-label{color:var(--accent)}
.step-block.expected .step-block-label{color:var(--ok)}

.step-content p{margin-bottom:.6em}
.step-content p:last-child{margin-bottom:0}
.step-content ul,.step-content ol{padding-left:18px;margin-bottom:.6em}
.step-content li{margin-bottom:.2em}
.step-content code{background:#eee;padding:1px 5px;border-radius:3px;
  font-size:.85em;font-family:'Courier New',monospace}
.step-content pre{background:#eee;padding:10px 12px;border-radius:5px;
  overflow-x:auto;font-size:.85em;margin-bottom:.6em}
.step-content pre code{background:transparent;padding:0}
.step-content strong{font-weight:600}
.step-img{max-width:100%;max-height:320px;object-fit:contain;
  border:1px solid var(--border);margin-top:var(--space-sm);display:block}

/* ── Footer ──────────────────────────────── */
.doc-footer{text-align:center;padding-top:var(--space-md);margin-top:var(--space-sm);
  border-top:1px solid var(--border);font-size:.75rem;color:#999}

@media print{
  .page{max-width:none;padding:0}
  body{font-size:12px}
}
</style>
</head>
<body>
<div class="page">

<header class="doc-header">
  <div class="doc-title">{{meta.title}} {{#}}</div>
  <div class="doc-meta">作成日: {{meta.date}}</div>
  <div class="doc-meta">更新日: {{meta.update}}</div>
</header>


<section class="doc-overview">
  <div class="step-content">{{#}}</div>
  <p>{{#.body}}</p>
</section>


{{#each ## steps}}
<section class="category">
  <h2 class="category-title">{{##}}</h2>
  {{#each ### steps}}
  <section class="step">
    <div class="step-num">{{##.index}}-{{###.index}}</div>
    <div class="step-head">
      <div class="step-ttl">{{###}}</div>
    </div>
    <div class="step-body">
      <div class="step-block instruction">
        <div class="step-block-label">操作手順</div>
        <div class="step-content">{{###.body}}</div>
      </div>
      {{#if ###.>}}
      <div class="step-block expected">
        <div class="step-block-label">期待される結果</div>
        <div class="step-content">{{###.>}}</div>
      </div>
      {{/if}}
    </div>
  </section>
  {{/each}}
</section>
{{/each}}

<footer class="doc-footer">
  Generated by Tejun.ts &mdash; ${date}
</footer>

</div>
</body>
</html>
